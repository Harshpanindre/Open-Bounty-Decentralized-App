<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Bounty DApp</title>
    
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Our Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Ethers.js (from CDN) -->
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
</head>
<body>

    <!-- Header -->
    <header>
        <nav class="container">
            <h1>OpenBounty</h1>
            <button id="connectButton">Connect Wallet</button>
        </nav>
        <div class="container wallet-status">
            Connected as: <span id="walletAddress">Not Connected</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        
        <!-- Create Bounty Form (Left Column) -->
        <aside class="create-bounty-section">
            <div class="form-card sticky-form">
                <h2>Create a New Bounty</h2>
                <form id="createBountyForm">
                    <div class="form-group">
                        <label for="taskDescription">Task Description</label>
                        <textarea id="taskDescription" rows="4" placeholder="Describe the task..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="rewardAmount">Reward Amount (ETH)</label>
                        <input type="text" id="rewardAmount" placeholder="e.g., 0.1">
                    </div>
                    <button type="submit" class="btn btn-green">
                        Create & Fund Bounty
                    </button>
                </form>
            </div>
        </aside>

        <!-- Bounty List (Right Column) -->
        <section class="bounty-list-section">
            <h2>Open Bounties</h2>
            <div id="bountyList" class="bounty-list-container">
                <!-- Bounties will be injected here by JavaScript -->
                <p id="loadingBounties">Loading bounties...</p>
            </div>
        </section>
    </main>

    <!-- Modal for Submitting Work (Hidden by Default) -->
    <div id="submissionModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Submit Your Work</h2>
            <p>You are submitting work for Bounty #<span id="modalBountyId"></span></p>
            <form id="submissionForm">
                <div class="form-group">
                    <label for="submissionUrl">Submission URL</label>
                    <input type="url" id="submissionUrl" placeholder="https://github.com/..." required>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancelSubmit" class="btn btn-gray">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-blue">
                        Submit Work
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Global Loading Overlay (Hidden by Default) -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loader"></div>
    </div>

    <!-- Our JavaScript (at the end of the body) -->
    <script src="app.js"></script>
</body>
</html>
